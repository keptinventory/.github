name: Bug
description: Something doesn't work as it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, and what you saw.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
  - type: input
    id: version
    attributes:
      label: Version
      description: Kept's version (`/version` on your Kept), and the integration's if it's about Home Assistant.
      placeholder: Kept 1.8.0
    validations:
      required: true
  - type: input
    id: setup
    attributes:
      label: Setup
      description: Docker Compose or Kubernetes, amd64 or arm64, and the browser or phone if it's about the app.
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove tokens, passwords and personal data first.
